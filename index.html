<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视觉图片生成工厂管理系统 — 低保真原型 v0.1</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ 顶部主导航 ══ -->
<header class="nav">
  <div class="nav__in">
    <a class="brand" href="#dash-todo">
      <span class="brand__mark">图</span>
      <span class="brand__txt">
        <b>视觉图片生成工厂管理系统</b>
        <i>一次分析 · 多处复用 · 全模块统一生图引擎</i>
      </span>
    </a>

    <nav class="tabs" id="groupTabs"></nav>

    <div class="nav__rt">
      <div class="search">
        <svg viewBox="0 0 20 20" width="15" height="15"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input placeholder="搜索 SKU、任务 ID、资产 ID…">
      </div>
      <div class="roleswitch" title="切换角色（仅原型演示用，正式系统按登录账号自动确定角色）">
        <select id="roleSelect"></select>
      </div>
      <div class="avatar" id="avatar" title="当前角色"></div>
      <button class="ibtn" id="specBtn" title="页面规格">
        <svg viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="3" width="14" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.5 3v14M6 7.5h3.5M6 10.5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ══ 主体 ══ -->
<div class="shell">
  <aside class="side">
    <div class="card side__card">
      <div class="side__hd">
        <div class="side__ico" id="sideIco"></div>
        <div>
          <b id="sideTitle"></b>
          <i id="sideSub"></i>
        </div>
      </div>
      <div id="sideNav"></div>
    </div>

    <div class="card side__ver">
      <div class="side__verhd">当前实例 · Layer 层版本</div>
      <ul>
        <li><span>实例</span><em>tenant_oldcat</em></li>
        <li><span>WF-29-L0</span><em>v1.0</em></li>
        <li><span>WF-29-L1-COSMO</span><em>v1.0</em></li>
        <li><span>WF-29-L1-SORFTIME</span><em>v1.0</em></li>
        <li><span>WF-29-L2-ENGINE</span><em>v1.0</em></li>
      </ul>
    </div>
  </aside>

  <main class="content">
    <div id="page"></div>
    <div class="pagefoot">原型仅用于确认信息架构与页面职责 · 数据均为假 · 不连接 n8n / Postgres</div>
  </main>
</div>

<!-- ══ 右侧规格抽屉 ══ -->
<aside class="spec" id="spec">
  <div class="spec__hd">
    <b>页面规格</b>
    <button class="x" id="specX">×</button>
  </div>
  <div class="spec__bd" id="specBody"></div>
</aside>
<div class="mask" id="mask"></div>

<!-- ══ 登录遮罩 ══ -->
<div class="login-mask" id="loginMask" style="display:none">
  <div class="login-box">
    <div class="login-brand"><span class="login-mark">图</span>视觉图片生成工厂管理系统</div>
    <div class="login-title">登录</div>
    <div class="login-sub">多用户账号 · 按角色分配权限</div>
    <input id="loginUser" class="login-inp" placeholder="用户名" autocomplete="username">
    <input id="loginPass" class="login-inp" type="password" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn" class="login-btn">登 录</button>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<script src="core.js?v=202609070106"></script>
<script src="pages-a.js?v=202609070106"></script>
<script src="pages-b.js?v=202609070106"></script>
<script src="pages-c.js?v=202609070106"></script>
<script src="pages-d.js?v=202609070106"></script>
<script>BOOT();</script>
</body>
</html>
